<div class="entries-container">
  <h2>Visitas Registradas</h2>
  
  <div class="entries-grid" *ngIf="visitasService.visitas$ | async as visitas">
    
    <div class="entry-card" *ngFor="let visita of visitas">
      <div class="entry-header">
        <span class="entry-name">{{ visita.nombre }}</span>
        <span class="entry-date">{{ visita.fechaRegistro | date:'medium' }}</span>
      </div>
      <div class="entry-body">
        <p class="entry-reason">{{ visita.motivo }}</p>
      </div>
    </div>

    <div *ngIf="visitas.length === 0" style="text-align: center; color: #777; grid-column: 1 / -1;">
      No hay visitas registradas aún.
    </div>
  </div>
</div>
