<div class="form-container">
  <h2>Registrar Visita</h2>
  <form (ngSubmit)="registrar()" #visitaForm="ngForm">
    <div class="form-group">
      <label for="nombre">Nombre del visitante</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="visita.nombre" placeholder="Ingresa tu nombre" required>
    </div>
    
    <div class="form-group">
      <label for="motivo">Motivo de la visita</label>
      <textarea id="motivo" name="motivo" [(ngModel)]="visita.motivo" placeholder="¿Cuál es el motivo de tu visita?" rows="4" required></textarea>
    </div>

    <button type="submit" class="submit-btn" [disabled]="!visitaForm.form.valid">Registrar</button>
  </form>
</div>
